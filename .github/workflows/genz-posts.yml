name: IELTS Daily 12:00 Posts

on:
  # Started on time by an external timer (cron-job.org → workflow_dispatch), see docs/TIMER_SETUP.md.
  # GitHub's own schedule ran these posts 3–6 hours late, so it is switched off.
  # Every day 12:00 Tashkent (kind: auto picks the day's type, see src/genz-post.js)
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which post type to send'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - upgrade
          - slang
          - emoji
          - truefalse
          - redflag
          - collocation
          - band
          - pov
          - poll
          - weekly
      dry_run:
        description: 'Dry run (render in log, do not post)'
        required: false
        default: false
        type: boolean

concurrency:
  group: channel-state
  cancel-in-progress: false

jobs:
  post-genz:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Python (poster rendering)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poster dependencies
        run: |
          pip install -r poster/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji

      - name: Post Gen Z post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          GENZ_KIND: ${{ github.event.inputs.kind }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node src/genz-post.js --dry-run
          else
            node src/genz-post.js
          fi

      - name: Save progress
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/genz-posts.json content/review.json 2>/dev/null || git add content/genz-posts.json
          git diff --staged --quiet || git commit -m "✨ Daily 12:00 post published [skip ci]"
          git pull --rebase && git push || echo "Nothing to push"
