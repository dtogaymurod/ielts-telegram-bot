name: IELTS Writing Samples

on:
  # Started on time by an external timer (cron-job.org → workflow_dispatch), see docs/TIMER_SETUP.md.
  # GitHub's own schedule ran these posts 3–6 hours late, so it is switched off.
  # Monday 12:00 Tashkent — Task 1, Thursday 12:00 — Task 2 (task: auto)
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to post'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '1'
          - '2'
      dry_run:
        description: 'Dry run (build in log, do not post)'
        required: false
        default: false
        type: boolean

jobs:
  post-writing-sample:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Python (poster rendering)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poster dependencies
        run: pip install -r poster/requirements.txt

      - name: Render and publish missing posters
        if: github.event.inputs.dry_run != 'true'
        run: |
          node src/writing-sample.js --render
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posters/writing
          if ! git diff --staged --quiet; then
            git commit -m "🖼 Render writing sample posters [skip ci]"
            git pull --rebase && git push
          fi

      - name: Post writing sample
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
          WRITING_TASK: ${{ github.event.inputs.task }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node src/writing-sample.js --dry-run
          else
            node src/writing-sample.js
          fi

      - name: Save progress
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/writing-samples.json
          git diff --staged --quiet || git commit -m "📝 Writing sample published [skip ci]"
          git pull --rebase && git push || echo "Nothing to push"
