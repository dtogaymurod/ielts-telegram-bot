name: IELTS Channel Auto-Post

on:
  schedule:
    - cron: '30 3 * * *'  # 08:30 Tashkent — Morning Start (Recent Speaking)
    - cron: '30 6 * * *'  # 11:30 Tashkent — Midday Vocabulary (Collocation)
    - cron: '30 8 * * *'  # 13:30 Tashkent — Lunch Study (Speaking Masterclass PDF Guide)
    - cron: '30 11 * * *' # 16:30 Tashkent — Afternoon Focus (Reading & Listening Strategy)
    - cron: '30 14 * * *' # 19:30 Tashkent — Evening Prime (Grammar Error Fix Quiz)
    - cron: '30 16 * * *' # 21:30 Tashkent — Bedtime Routine (Podcast / TED Talk Suggestion)

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      time_slot:
        description: 'Time slot to simulate'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - recent-speaking
          - collocation
          - speaking
          - reading-listening
          - grammar-quiz
          - podcast
      content_type:
        description: 'Force specific content type'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - recent-speaking
          - collocation
          - speaking
          - reading-listening
          - grammar-quiz
          - podcast
          - idiom
          - vocabulary
      dry_run:
        description: 'Dry run (preview in log, do not post)'
        required: false
        default: false
        type: boolean

jobs:
  post-to-channel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Determine time slot
        id: timeslot
        run: |
          # Manual trigger with input
          if [ -n "${{ github.event.inputs.time_slot }}" ]; then
            echo "slot=${{ github.event.inputs.time_slot }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Auto-detect from Tashkent time (UTC+5)
          UTC_HOUR=$(date -u +%H)
          TASHKENT_HOUR=$(( (10#$UTC_HOUR + 5) % 24 ))
          echo "Detected UTC Hour: $UTC_HOUR | Tashkent Hour: $TASHKENT_HOUR"
          
          if [ $TASHKENT_HOUR -ge 8 ] && [ $TASHKENT_HOUR -lt 11 ]; then
            echo "slot=recent-speaking" >> $GITHUB_OUTPUT
          elif [ $TASHKENT_HOUR -ge 11 ] && [ $TASHKENT_HOUR -lt 13 ]; then
            echo "slot=collocation" >> $GITHUB_OUTPUT
          elif [ $TASHKENT_HOUR -ge 13 ] && [ $TASHKENT_HOUR -lt 16 ]; then
            echo "slot=speaking" >> $GITHUB_OUTPUT
          elif [ $TASHKENT_HOUR -ge 16 ] && [ $TASHKENT_HOUR -lt 18 ]; then
            echo "slot=reading-listening" >> $GITHUB_OUTPUT
          elif [ $TASHKENT_HOUR -ge 18 ] && [ $TASHKENT_HOUR -lt 21 ]; then
            echo "slot=grammar-quiz" >> $GITHUB_OUTPUT
          elif [ $TASHKENT_HOUR -ge 21 ] && [ $TASHKENT_HOUR -le 22 ]; then
            echo "slot=podcast" >> $GITHUB_OUTPUT
          else
            echo "slot=night-blackout" >> $GITHUB_OUTPUT
          fi

      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIME_SLOT: ${{ steps.timeslot.outputs.slot }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node src/index.js --dry-run
          else
            node src/index.js
          fi

      - name: Commit usage tracking changes
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/*.json
          git diff --staged --quiet || git commit -m "📊 Update content usage tracking [skip ci]"
          git push || echo "Nothing to push"
