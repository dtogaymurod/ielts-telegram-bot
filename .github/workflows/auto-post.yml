name: IELTS Channel Auto-Post

on:
  schedule:
    - cron: '30 14 * * *' # 19:30 Tashkent (14:30 UTC) — Daily Prime-Time Post (Listening ➡️ Reading ➡️ Writing ➡️ Speaking)

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      skill:
        description: 'Force specific skill (optional)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - listening
          - reading
          - writing
          - speaking
      dry_run:
        description: 'Dry run (preview in log, do not post)'
        required: false
        default: false
        type: boolean

jobs:
  post-to-channel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKILL: ${{ github.event.inputs.skill }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node src/index.js --dry-run
          else
            node src/index.js
          fi

      - name: Commit rotation and tracking changes
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/*.json
          git diff --staged --quiet || git commit -m "📊 Update skill rotation & content tracking [skip ci]"
          git push || echo "Nothing to push"
