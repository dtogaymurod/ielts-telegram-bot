name: IELTS Channel Auto-Post

on:
  # Started on time by an external timer (cron-job.org → workflow_dispatch), see docs/TIMER_SETUP.md.
  # GitHub's own schedule ran these posts 3–6 hours late, so it is switched off.
  # Daily 19:30 Tashkent — Prime-Time Post (Listening ➡️ Reading ➡️ Writing ➡️ Speaking)
  workflow_dispatch:
    inputs:
      skill:
        description: 'Force specific skill (optional)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - listening
          - reading
          - writing
          - speaking
      dry_run:
        description: 'Dry run (preview in log, do not post)'
        required: false
        default: false
        type: boolean

concurrency:
  group: channel-state
  cancel-in-progress: false

jobs:
  post-to-channel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Python (poster rendering)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poster dependencies
        run: |
          pip install -r poster/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji

      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKILL: ${{ github.event.inputs.skill }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node src/index.js --dry-run
          else
            node src/index.js
          fi

      - name: Commit rotation and tracking changes
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/*.json
          git diff --staged --quiet || git commit -m "📊 Update skill rotation & content tracking [skip ci]"
          git pull --rebase && git push || echo "Nothing to push"
