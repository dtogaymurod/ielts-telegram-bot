name: IELTS Channel Auto-Post

on:
  schedule:
    - cron: '0 4 * * *' # 09:00 Tashkent
    - cron: '0 6 * * *' # 11:00 Tashkent
    - cron: '0 8 * * *' # 13:00 Tashkent
    - cron: '0 10 * * *' # 15:00 Tashkent
    - cron: '0 12 * * *' # 17:00 Tashkent
    - cron: '0 14 * * *' # 19:00 Tashkent
    - cron: '0 16 * * *' # 21:00 Tashkent

  # Qo'lda ishga tushirish imkoniyati (testing uchun)
  workflow_dispatch:
    inputs:
      time_slot:
        description: 'Time slot to simulate (mapped directly to content)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - recent-speaking
          - collocation
          - speaking
          - idiom
          - reading-listening
          - grammar-quiz
          - podcast
      content_type:
        description: 'Force content type'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - recent-speaking
          - collocation
          - speaking
          - idiom
          - reading-listening
          - grammar-quiz
          - podcast
          - vocabulary
      dry_run:
        description: 'Dry run (no actual posting)'
        required: false
        default: false
        type: boolean

jobs:
  post-to-channel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Determine time slot
        id: timeslot
        run: |
          # Manual trigger with input
          if [ -n "${{ github.event.inputs.time_slot }}" ]; then
            echo "slot=${{ github.event.inputs.time_slot }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Auto-detect from cron schedule (UTC time)
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "04" ]; then
            echo "slot=recent-speaking" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "06" ]; then
            echo "slot=collocation" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "08" ]; then
            echo "slot=speaking" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "10" ]; then
            echo "slot=idiom" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "12" ]; then
            echo "slot=reading-listening" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "14" ]; then
            echo "slot=grammar-quiz" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "16" ]; then
            echo "slot=podcast" >> $GITHUB_OUTPUT
          else
            echo "slot=" >> $GITHUB_OUTPUT
          fi

      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIME_SLOT: ${{ steps.timeslot.outputs.slot }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node src/index.js --dry-run
          else
            node src/index.js
          fi

      - name: Commit usage tracking changes
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/*.json
          git diff --staged --quiet || git commit -m "📊 Update content usage tracking [skip ci]"
          git push || echo "Nothing to push"
